name: livetranslate-init
services:
  backend:
    build:
      context: ./backend
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-}
      SUMOPOD_BASE_URL: ${SUMOPOD_BASE_URL:-https://ai.sumopod.com/v1}
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-}
      SUMOPOD_MODEL: ${SUMOPOD_MODEL:-}
    depends_on:
      - auth-service
    ports:
      - "127.0.0.1:${APP_PORT:-8989}:8080"
    volumes:
      - ./fixtures:/app/fixtures:ro
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_AUTH_REDIRECT_URL: ${SUPABASE_AUTH_REDIRECT_URL:-}
      DATABASE_URL: ${DATABASE_URL:-}
